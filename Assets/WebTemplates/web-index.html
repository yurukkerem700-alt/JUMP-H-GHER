<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"><meta name="theme-color" content="#100e16"><title>Kök Yankısı • Jump Higher</title><link rel="icon" href="icon.png"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100e16;color:#e6c5a0;font-family:system-ui,sans-serif}#game{width:100%;height:100%;display:block;touch-action:none;outline:none}#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#322231,#100e16 65%);gap:18px}img{width:min(28vw,180px);border-radius:30px;box-shadow:0 0 70px #a9482426}h1{font-size:clamp(24px,5vw,40px);letter-spacing:.12em;margin:6px}p{font-size:14px;color:#a28d87;margin:0}progress{width:min(65vw,300px);height:5px;accent-color:#d79060}#error{display:none;max-width:520px;padding:24px;text-align:center;color:#f1a59a}</style></head><body><canvas id="game" tabindex="0"></canvas><div id="loading"><img src="icon.png" alt="Kök Gezgin"><h1>KÖK YANKISI</h1><p>Sonsuza doğru yüksel</p><progress id="progress" value="0" max="1"></progress><p id="state">Oyun yükleniyor…</p><div id="error" role="alert"></div></div><script src="__LOADER_JS__"></script><script>const canvas=document.getElementById('game');function failure(error){document.getElementById('state').textContent='Oyun başlatılamadı';let el=document.getElementById('error');el.style.display='block';el.textContent=String(error)+' • Sayfayı yenileyip tekrar deneyebilirsin.';}createUnityInstance(canvas,{dataUrl:'__DATA__',frameworkUrl:'__FRAMEWORK_JS__',codeUrl:'__WASM__',streamingAssetsUrl:'StreamingAssets',companyName:'Kerem Yürük',productName:'Kök Yankısı',productVersion:'0.5.0',matchWebGLToCanvasSize:true},p=>document.getElementById('progress').value=p).then(instance=>{window.game=instance;document.getElementById('loading').style.display='none';canvas.focus();}).catch(failure);window.addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();});</script></body></html>
