name: Unity store builds
on: workflow_dispatch
jobs:
  build:
    strategy:
      fail-fast: false
      matrix: { target: [Android, StandaloneWindows64] }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { lfs: true }
      - uses: actions/cache@v4
        with: { path: Library, key: Library-${{ matrix.target }} }
      - name: Keystore
        if: matrix.target == 'Android'
        env: { KS: '${{ secrets.ANDROID_KEYSTORE_BASE64 }}' }
        run: if [ -n "$KS" ]; then echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"; echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> $GITHUB_ENV; fi
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        with:
          unityVersion: 6000.0.84f1
          targetPlatform: ${{ matrix.target }}
          buildMethod: ${{ matrix.target == 'Android' && 'StoreRelease.Android' || 'StoreRelease.SteamWindows' }}
          androidExportType: androidAppBundle
      - uses: actions/upload-artifact@v4
        with: { name: build-${{ matrix.target }}, path: Builds }
