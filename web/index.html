<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"><meta name="theme-color" content="#100e16"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Kök Yankısı"><title>Kök Yankısı • Jump Higher</title><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.png"><link rel="apple-touch-icon" href="icon-192.png"><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#100e16;color:#e6c5a0;font-family:system-ui,sans-serif;overscroll-behavior:none}#game{width:100%;height:100%;display:block;touch-action:none;outline:none}#loading{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,#322231,#100e16 65%);gap:18px}img{width:min(28vw,180px);border-radius:30px;box-shadow:0 0 70px #a9482426}h1{font-size:clamp(24px,5vw,40px);letter-spacing:.12em;margin:6px}p{font-size:14px;color:#a28d87;margin:0}progress{width:min(65vw,300px);height:5px;accent-color:#d79060}#error{display:none;max-width:520px;padding:24px;text-align:center;color:#f1a59a}#install,#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:max(16px,env(safe-area-inset-bottom));z-index:9;border-radius:999px;padding:10px 18px;font-size:14px;background:#322231;color:#e6c5a0;border:1px solid #d7906066;max-width:92vw;text-align:center}#install{display:none;font-family:inherit;cursor:pointer}#toast{display:none;pointer-events:none}</style></head><body><canvas id="game" tabindex="0"></canvas><div id="loading"><img src="icon.png" alt="Kök Gezgin"><h1>KÖK YANKISI</h1><p>Sonsuza doğru yüksel</p><progress id="progress" value="0" max="1"></progress><p id="state">Oyun yükleniyor…</p><div id="error" role="alert"></div></div><button id="install" type="button">📲 Cihaza yükle</button><div id="toast" role="status"></div><script src="Build/web.loader.js"></script><script>const canvas=document.getElementById('game');function failure(error){document.getElementById('state').textContent='Oyun başlatılamadı';let el=document.getElementById('error');el.style.display='block';el.textContent=String(error)+' • Sayfayı yenileyip tekrar deneyebilirsin.';}createUnityInstance(canvas,{dataUrl:'Build/web.data',frameworkUrl:'Build/web.framework.js',codeUrl:'Build/web.wasm',streamingAssetsUrl:'StreamingAssets',companyName:'Kerem Yürük',productName:'Kök Yankısı',productVersion:'0.5.0',matchWebGLToCanvasSize:true},p=>document.getElementById('progress').value=p).then(instance=>{window.game=instance;document.getElementById('loading').style.display='none';canvas.focus();}).catch(failure);window.addEventListener('keydown',e=>{if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();});
const toastEl=document.getElementById('toast'),installBtn=document.getElementById('install');let toastTimer;function toast(text,ms){toastEl.textContent=text;toastEl.style.display='block';clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.style.display='none',ms||4000);}
const standalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;let installEvent;window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEvent=e;if(!standalone)installBtn.style.display='block';});installBtn.addEventListener('click',async()=>{if(!installEvent)return;installEvent.prompt();await installEvent.userChoice;installEvent=null;installBtn.style.display='none';});window.addEventListener('appinstalled',()=>{installBtn.style.display='none';toast('Kök Yankısı cihaza yüklendi');});
if(!standalone&&/iphone|ipad|ipod/i.test(navigator.userAgent)&&!sessionStorage.getItem('iosHint')){sessionStorage.setItem('iosHint','1');setTimeout(()=>toast('Yüklemek için Paylaş ▸ Ana Ekrana Ekle',7000),2500);}
if('serviceWorker'in navigator){navigator.serviceWorker.addEventListener('message',e=>{if(e.data&&e.data.type==='offline-ready')toast('Oyun çevrimdışı oynanmaya hazır ✔');});window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));}
</script></body></html>
